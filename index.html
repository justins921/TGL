<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuesday Golf League - Schedule Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tuesday Golf League</h1>
    <p class="subtitle">Schedule Generator</p>
  </header>

  <main>
    <section id="setup" class="card">
      <h2>League Setup</h2>

      <div class="form-group">
        <label for="numPlayers">Number of Players</label>
        <input type="number" id="numPlayers" min="4" max="40" value="8">
      </div>

      <div class="form-group">
        <label for="numWeeks">Number of Weeks</label>
        <input type="number" id="numWeeks" min="1" max="52" value="10">
      </div>

      <div class="form-group">
        <label for="groupSize">Players per Group</label>
        <select id="groupSize">
          <option value="2">Twosomes</option>
          <option value="3">Threesomes</option>
          <option value="4" selected>Foursomes</option>
        </select>
      </div>

      <div class="form-group">
        <label>Player Names</label>
        <div id="playerNames" class="player-names-grid"></div>
      </div>

      <button id="generateBtn" class="btn-primary">Generate Schedule</button>
    </section>

    <section id="scheduleOutput" class="card hidden">
      <div class="schedule-header">
        <h2>League Schedule</h2>
        <button id="printBtn" class="btn-secondary">Print Schedule</button>
      </div>
      <div id="scheduleContent"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
