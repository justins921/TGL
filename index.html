<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuesday Golf League - Schedule Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tuesday Golf League</h1>
    <p class="subtitle">Schedule Generator</p>
  </header>

  <main>
    <section id="setup" class="card">
      <h2>League Setup</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="numPlayers">Number of Players</label>
          <input type="number" id="numPlayers" min="4" max="40" value="17">
        </div>
        <div class="form-group">
          <label for="numWeeks">Number of Weeks</label>
          <input type="number" id="numWeeks" min="1" max="52" value="16">
        </div>
      </div>

      <div class="form-group">
        <label>Player Names</label>
        <div id="playerNames" class="player-names-grid"></div>
      </div>

      <div class="form-group">
        <label>Bye Week Assignments <span class="label-hint">(optional — select a week for players who know they'll be gone)</span></label>
        <div id="byeAssignments" class="bye-assignments"></div>
      </div>

      <button id="generateBtn" class="btn-primary">Generate Schedule</button>
    </section>

    <section id="scheduleOutput" class="card hidden">
      <div class="schedule-header">
        <h2>League Schedule</h2>
        <div class="schedule-actions">
          <button id="regenerateBtn" class="btn-secondary">Regenerate</button>
          <button id="printBtn" class="btn-secondary">Print Schedule</button>
        </div>
      </div>
      <div id="scheduleSummary" class="schedule-summary"></div>
      <div id="scheduleContent"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
